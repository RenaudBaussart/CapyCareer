name: CapyCareer CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-client:
    runs-on: self-hosted
    container: node:20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm run install:all

      - name: Build Check (Client)
        run: npm run build --prefix client

  build-server:
    runs-on: self-hosted
    container: node:20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm run install:all

      - name: Build Check (Server)
        run: cd server && npx tsc

  lint-client:
    needs: [build-client, build-server]
    runs-on: self-hosted
    container: node:20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm run install:all

      - name: Lint Quality Checks (Client)
        run: npm run lint --prefix client

  lint-server:
    needs: [build-client, build-server]
    runs-on: self-hosted
    container: node:20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm run install:all

      - name: Lint Quality Checks (Server)
        run: cd server && npx eslint .

  test-server:
    needs: [build-client, build-server]
    runs-on: self-hosted
    container: node:20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm run install:all

      - name: Run Backend Tests
        run: npm run test --prefix server