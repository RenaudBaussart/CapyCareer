name: CapyCareer CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-client:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '26.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Build Check (Client)
        run: npm run build --prefix client

  build-server:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '26.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Build Check (Server)
        run: cd server && npx tsc

  lint-client:
    needs: [build-client, build-server]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '26.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Lint Quality Checks (Client)
        run: npm run lint --prefix client

  lint-server:
    needs: [build-client, build-server]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '26.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Lint Quality Checks (Server)
        run: cd server && npx eslint .

  test-server:
    needs: [build-client, build-server]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '26.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Run Backend Tests
        run: npm run test --prefix server